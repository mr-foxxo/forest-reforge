            core-wk07: {ansible_host: 192.0.2.37, reforge_node_ip: 192.0.2.37, reforge_hypervisor: hv02}
            core-wk08: {ansible_host: 192.0.2.38, reforge_node_ip: 192.0.2.38, reforge_hypervisor: hv02}
    names:
      hosts: {}
