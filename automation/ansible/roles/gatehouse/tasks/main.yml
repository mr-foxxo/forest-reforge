---
- name: Validate cluster contract
  ansible.builtin.include_role:
    name: cluster_contract
- name: Require a real delegated DNS zone and staged ACME rollout
  ansible.builtin.assert:
    that:
      - reforge_cert_manager_version is match('^v?[0-9]+\.[0-9]+\.[0-9]+$')
      - reforge_acme_email | length > 3
      - reforge_dns01_zone not in ['example.net', 'example.org', 'example.com']
      - reforge_cloudflare_dns_token | length > 0
      - not reforge_acme_production | bool or reforge_acme_staging_verified | bool
      - reforge_tls_names | length > 0
  no_log: true
- name: Install cert-manager
  kubernetes.core.helm:
    kubeconfig: "{{ reforge_kubeconfig }}"
    release_name: cert-manager
    release_namespace: cert-manager
    create_namespace: true
    chart_ref: cert-manager
    chart_repo_url: https://charts.jetstack.io
    chart_version: "{{ reforge_cert_manager_version }}"
    release_values:
      crds: {enabled: true}
    wait: true
    atomic: true
    timeout: 10m
- name: Store zone-scoped DNS credential
  kubernetes.core.k8s:
    kubeconfig: "{{ reforge_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: cloudflare-dns, namespace: cert-manager}
      type: Opaque
      data:
        api-token: "{{ reforge_cloudflare_dns_token | b64encode }}"
  no_log: true
  diff: false
- name: Configure issuers, certificate and shared HTTPS Gateway
  kubernetes.core.k8s:
    kubeconfig: "{{ reforge_kubeconfig }}"
    definition: "{{ lookup('template', 'gateway.yaml.j2') | from_yaml_all | list }}"
    apply: true
- name: Wait for certificate issuance
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ reforge_kubeconfig }}", -n, "{{ reforge_gateway_namespace }}", wait, certificate/core-private, --for=condition=Ready, --timeout=300s]
  changed_when: false
  when: not ansible_check_mode

