---
- name: Validate operator intent
  ansible.builtin.include_role:
    name: contract
- name: Validate initial control-plane inputs
  ansible.builtin.assert:
    that:
      - groups['control_plane'] | length in [1, 3, 5]
      - reforge_node_ip | length > 0
      - reforge_node_interface | length > 0
      - reforge_kube_vip_image is match('^.+@sha256:[a-f0-9]{64}$')
      - reforge_encryption_key | b64decode(encoding='latin-1') | length == 32
  no_log: true
- name: Resolve API name before bootstrap
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ reforge_api_dns }}"]
  register: reforge_api_lookup
  changed_when: false
  check_mode: false
- name: Require reserved API address in DNS
  ansible.builtin.assert:
    that: reforge_api_vip in reforge_api_lookup.stdout.split()
- name: Inspect existing cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: reforge_existing_cluster
- name: Create private configuration directory
  ansible.builtin.file:
    path: /etc/kubernetes/reforge
    state: directory
    mode: '0700'
- name: Inspect existing encryption configuration
  ansible.builtin.stat:
    path: /etc/kubernetes/reforge/encryption.yaml
  register: reforge_existing_encryption
- name: Refuse implicit encryption key rotation
  when: reforge_existing_encryption.stat.exists
  block:
    - name: Read stored encryption key privately
      ansible.builtin.slurp:
        src: /etc/kubernetes/reforge/encryption.yaml
      register: reforge_stored_encryption
      no_log: true
    - name: Require existing key to match inventory
      ansible.builtin.assert:
        that: (reforge_stored_encryption.content | b64decode | from_yaml)['resources'][0]['providers'][0]['secretbox']['keys'][0]['secret'] == reforge_encryption_key
        fail_msg: Encryption key differs. Use a staged rotation procedure; never replace it during bootstrap.
      no_log: true
- name: Require encryption recovery material for existing cluster
  ansible.builtin.assert:
    that: not reforge_existing_cluster.stat.exists or reforge_existing_encryption.stat.exists
- name: Install encryption key with restricted permissions
  ansible.builtin.template:
    src: encryption.yaml.j2
    dest: /etc/kubernetes/reforge/encryption.yaml
    mode: '0600'
  no_log: true
  diff: false
- name: Initialize new cluster only
  when: not reforge_existing_cluster.stat.exists
  block:
    - name: Create static manifest directory
      ansible.builtin.file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: '0755'
    - name: Render kubeadm configuration
      ansible.builtin.template:
        src: kubeadm-init.yaml.j2
        dest: /etc/kubernetes/reforge/init.yaml
        mode: '0600'
    - name: Start API VIP without leader election for initial bootstrap
      ansible.builtin.template:
        src: kube-vip.yaml.j2
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        mode: '0600'
      vars:
        reforge_vip_bootstrap: true
    - name: Initialize kubeadm with encrypted Secrets and no kube-proxy
      ansible.builtin.command:
        argv: [kubeadm, init, --config, /etc/kubernetes/reforge/init.yaml]
        creates: /etc/kubernetes/admin.conf
      no_log: true
- name: Give kube-vip a local API path independent of the VIP
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /etc/kubernetes/reforge/vip.conf
    remote_src: true
    mode: '0600'
    force: false
  no_log: true
  diff: false
- name: Point kube-vip at this control plane
  ansible.builtin.lineinfile:
    path: /etc/kubernetes/reforge/vip.conf
    regexp: '^\s*server:'
    line: '    server: https://{{ reforge_node_ip }}:6443'
  no_log: true
  diff: false
- name: Switch API VIP to steady-state leader election
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    mode: '0600'
  vars:
    reforge_vip_bootstrap: false
- name: Verify API VIP
  ansible.builtin.wait_for:
    host: "{{ reforge_api_vip }}"
    port: 6443
    timeout: 180

